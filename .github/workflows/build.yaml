name: Build and Push Latest Supabase Postgres Image

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "postgres/**"
      - ".github/workflows/build.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/6ixfalls/supabase-postgres
  SUPABASE_TAGS_API: https://hub.docker.com/v2/namespaces/supabase/repositories/postgres/tags?page_size=100&ordering=last_updated
  LATEST_POSTGRES_MAJOR: 17

jobs:
  build-postgres:
    name: Build PostgreSQL ${{ matrix.postgres_major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres_major: [15, 17]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Get latest Supabase Postgres version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          url="${SUPABASE_TAGS_API}"
          major="${{ matrix.postgres_major }}"
          version=""

          while [[ -n "${url}" && -z "${version}" ]]; do
            response="$(curl --fail --silent --show-error --location --retry 3 "${url}")"
            version="$(
              jq -r '.results[].name' <<<"${response}" |
                grep -E "^${major}\.[0-9]+\.[0-9]+\.[0-9]+$" |
                sort -V |
                tail -n1 || true
            )"
            url="$(jq -r '.next // empty' <<<"${response}")"
          done

          if [[ -z "${version}" ]]; then
            echo "No stable Supabase Postgres version tag found" >&2
            exit 1
          fi

          version_major="${version%%.*}"
          if [[ "${version_major}" != "${major}" ]]; then
            echo "Resolved Supabase Postgres ${version} for unexpected major ${version_major}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          echo "Building Supabase Postgres ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with multiple tags
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            POSTGRES_VERSION=${{ steps.get_version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.major }}
            ${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
            ${{ matrix.postgres_major == env.LATEST_POSTGRES_MAJOR && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
