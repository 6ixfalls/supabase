name: Build and Push Supabase Secrets Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "secrets/**"
      - ".github/workflows/build-secrets.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/6ixfalls/supabase-secrets

jobs:
  build-secrets:
    name: Build supabase-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push supabase-secrets
        uses: docker/build-push-action@v5
        with:
          context: ./secrets
          file: ./secrets/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=supabase-secrets
          cache-to: type=gha,mode=max,scope=supabase-secrets
